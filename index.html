  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: #fafafa;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
      color: #1d1d1f;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: -0.02em;
    }

    .hint-line {
      font-size: 1rem;
      color: #636366;
      text-align: center;
    }

    .example-word {
      color: #1d1d1f;
      font-weight: 600;
    }

    /* Mic button */
    .mic-btn {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: none;
      background: #1d1d1f;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .mic-btn:active {
      transform: scale(0.93);
    }

    .mic-btn.listening {
      background: #ff3b30;
      animation: breathe 2s ease-in-out infinite;
    }

    .mic-icon {
      width: 28px;
      height: 28px;
      fill: white;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .mic-btn:not(.listening) {
      animation: idlePulse 2.5s ease-in-out infinite;
    }

    @keyframes idlePulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(29, 29, 31, 0.18);
      }
      50% {
        box-shadow: 0 0 0 14px rgba(29, 29, 31, 0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mic-btn,
      .mic-btn.listening {
        animation: none;
      }
      .display-word,
      .tap-hint {
        animation: none;
        opacity: 1;
      }
    }

    .listening-text {
      font-size: 0.875rem;
      color: #48484a;
      opacity: 0;
      transition: opacity 0.2s ease;
      height: 1.2em;
    }

    .listening-text.show {
      opacity: 1;
    }

    /* Waveform sits with the mic so “listening” is one cluster */
    .waveform-container {
      width: 180px;
      height: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, height 0.2s ease;
    }

    .waveform-container.show {
      opacity: 1;
      height: 48px;
    }

    #waveformCanvas {
      width: 100%;
      height: 100%;
    }

    /* Word display */
    .word-stage {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      inset: 0;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .word-stage.active {
      opacity: 1;
      pointer-events: auto;
    }

    .display-word {
      font-size: clamp(3.5rem, 18vw, 6rem);
      font-weight: 700;
      color: #1d1d1f;
      letter-spacing: -0.03em;
      animation: fadeUp 0.35s ease;
      text-align: center;
      padding: 0 1.5rem;
      overflow-wrap: break-word;
      word-break: break-word;
      max-width: 100%;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .tap-hint {
      font-size: 1rem;
      color: #636366;
      margin-top: 4rem;
      opacity: 0;
      animation: fadeIn 0.3s ease 0.1s both;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Error */

    .error-msg {
      position: fixed;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      background: #1d1d1f;
      color: white;
      padding: 0.875rem 1.5rem;
      border-radius: 24px;
      font-size: 0.875rem;
      font-weight: 500;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      text-align: center;
      max-width: min(85vw, 22rem);
      white-space: normal;
      overflow-wrap: break-word;
      line-height: 1.35;
    }

    .error-msg.show {
      opacity: 1;
    }

    .error-msg.sticky {
      pointer-events: auto;
    }

    .error-retry {
      display: inline-block;
      margin-top: 0.65rem;
      margin-left: 0.5rem;
      padding: 0.45rem 1rem;
      border: none;
      border-radius: 100px;
      background: #f5f5f7;
      color: #1d1d1f;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .error-retry[hidden] {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1c1c1e;
        color: #f5f5f7;
      }

      .title {
        color: #f5f5f7;
      }

      .hint-line {
        color: #98989d;
      }

      .example-word {
        color: #f5f5f7;
      }

      .mic-btn {
        background: #f5f5f7;
      }

      .mic-icon {
        fill: #1c1c1e;
      }

      .mic-btn:active {
        background: #d1d1d6;
      }

      .mic-btn.listening {
        background: #ff453a;
      }

      @keyframes idlePulse {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(245, 245, 247, 0.18);
        }
        50% {
          box-shadow: 0 0 0 14px rgba(245, 245, 247, 0);
        }
      }

      .listening-text {
        color: #98989d;
      }

      .word-stage {
        background: #1c1c1e;
      }

      .display-word {
        background: linear-gradient(135deg, #ff453a, #ff9f0a, #30d158);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .tap-hint {
        color: #98989d;
      }

      .error-msg {
        background: #f5f5f7;
        color: #1c1c1e;
      }

      .error-retry {
        background: #1c1c1e;
        color: #f5f5f7;
      }
    }

  </style>

<body>

  <div class="container">
    <h1 class="title">How do you spell…?</h1>
    <p class="hint-line">Tap the mic and say a word — try <span class="example-word">dinosaur</span></p>

    <button class="mic-btn" id="micBtn" aria-label="Tap to speak">
      <svg class="mic-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>

    <div class="waveform-container" id="waveformContainer">
      <canvas id="waveformCanvas"></canvas>
    </div>

    <div class="listening-text" id="listeningText" aria-live="polite">Listening...</div>
  </div>

  <div class="word-stage" id="wordStage" tabindex="-1">
    <div class="display-word" id="displayWord" aria-live="polite" role="status"></div>
    <div class="tap-hint" id="tapHint" style="display:none">Tap to try another word</div>
  </div>

  <div class="error-msg" id="errorMsg" role="alert" aria-live="assertive">
    <span id="errorText"></span>
    <button type="button" class="error-retry" id="errorRetry" hidden>Try again</button>
  </div>

  <script>
    // === Google Analytics Event Tracking ===
    function trackEvent(eventName, params = {}) {
      if (typeof GA_ID === 'string' && GA_ID && typeof gtag !== 'undefined') {
        gtag('event', eventName, params);
      }
    }


    // Track browser and device info on page load
    function getDeviceType() {
      const userAgent = navigator.userAgent.toLowerCase();
      if (/mobile|android|iphone|ipad|ipod/i.test(userAgent)) {
        return 'mobile';
      } else if (/tablet|ipad|android(?!.*mobile)/i.test(userAgent)) {
        return 'tablet';
      } else {
        return 'desktop';
      }
    }

    function getBrowserInfo() {
      const userAgent = navigator.userAgent;
      let browser = 'Unknown';
      let version = 'Unknown';
      
      if (userAgent.indexOf('Chrome') > -1 && userAgent.indexOf('Edg') === -1) {
        browser = 'Chrome';
        version = userAgent.match(/Chrome\/([\d.]+)/)?.[1] || 'Unknown';
      } else if (userAgent.indexOf('Safari') > -1 && userAgent.indexOf('Chrome') === -1) {
        browser = 'Safari';
        version = userAgent.match(/Version\/([\d.]+)/)?.[1] || 'Unknown';
      } else if (userAgent.indexOf('Firefox') > -1) {
        browser = 'Firefox';
        version = userAgent.match(/Firefox\/([\d.]+)/)?.[1] || 'Unknown';
      } else if (userAgent.indexOf('Edg') > -1) {
        browser = 'Edge';
        version = userAgent.match(/Edg\/([\d.]+)/)?.[1] || 'Unknown';
      }
      
      return { browser, version };
    }

    // Send initial page view with browser/device info
    const browserInfo = getBrowserInfo();
    const deviceType = getDeviceType();
    trackEvent('page_view', {
      browser: browserInfo.browser,
      browser_version: browserInfo.version,
      device_type: deviceType,
      language: navigator.language
    });

    // === Content Filter ===
    // Blocked words are INLINED below (blocked-words.json stays in the repo
    // as the human-editable source of truth). Inlining closes the startup
    // window where a word recognised before the old fetch() resolved could
    // bypass the category lists, and drops one network dependency.
    const BLOCKED_CATEGORIES = {
      "profanity": [
        "fuck", "fuk", "shit", "bitch", "asshole", "ass", "dick", "piss",
        "bastard", "motherfucker", "whore", "slut", "nigga", "wtf", "stfu",
        "arse", "arsehole", "bollocks", "bugger", "cocksucker", "cunt",
        "twat", "wanker"
      ],
      "slurs": [
        "nigger", "nig", "chink", "spic", "fag", "faggot", "dyke", "kike",
        "wetback", "tranny", "retard", "coon", "gook", "jap", "paki",
        "pikey", "raghead", "towelhead"
      ],
      "hate": [
        "racist", "bigot", "sexist", "homophobe", "misogynist",
        "antisemite", "xenophobe"
      ],
      "sexual": [
        "porn", "sex", "nude", "xxx", "erotic", "anal", "cum", "orgasm",
        "masturbate", "dildo", "blowjob", "pussy", "boobs", "tits",
        "fetish", "handjob", "horny", "rimjob", "sexy"
      ],
      "bullying": [
        "loser", "stupid", "idiot", "ugly", "crybaby", "dumb", "moron",
        "suck", "fatty", "fatso", "four eyes", "pathetic", "shut up",
        "worthless"
      ],
      "self_harm": [
        "suicide", "kill myself", "harm myself", "cut myself",
        "hang myself", "overdose", "self-harm", "kys", "want to die",
        "end my life", "end it all", "cutting myself",
        "don't want to live", "want to kill myself"
      ]
    };
    // Build optimised lookup set from all categories (normalised)
    let BLOCKED_WORDS_SET = new Set(
      Object.values(BLOCKED_CATEGORIES).flat().map(w => w.toLowerCase().replace(/[^a-z]/g, ''))
    );
    // Real words that look like a blocked stem — always allowed.
    // Whole-word patterns below already spare most school words; this is
    // a last-resort net for anything a stem still swallows.
    const ALLOWED_WORDS = new Set([
      'dickens', 'dickinson', 'dickory', 'dickensian',
      'shiitake', 'shitake',
    ]);
    // Fuzzy shapes are ANCHORED to the full normalised token (see
    // isWordBlocked). Substring patterns used to block dickensian, shiitake,
    // etc. Whole-word + letter-repeat/leetspeak only — high-risk stems only.
    // Bullying words stay exact-match in BLOCKED_CATEGORIES (no fuzzy).
    const FUZZY_PATTERNS = [
      /^f+u*c+k+(?:e+r+|i+n+g+)?$/,   // fuck, fck, fuuuck, fucker, fucking
      /^p+h+u+c+k+$/,                  // phuck
      /^s+h+i*t+$/,                    // shit, sht, shiit
      /^b+i*t+c+h+$/,                  // bitch, btch, bitcch
      /^a+s+s+h+o+l+e+$/,              // asshole
      /^n+i+g+(?:g+|a+|e+r+)*$/,       // nig, nigg, nigga, nigger
      /^w+h+o+r+e+$/,
      /^s+l+u+t+$/,
      /^d+i+c+k+$/,                    // dick / diick / dck — not dickens
      /^p+i+s+s+$/,
      /^b+a+s+t+a+r+d+$/,
      /^r+e+t+a+r+d+$/,                // retard — not retardant
      /^s+t+f+u+$/,
      /^[ck]+u+n+t+$/,                 // cunt / kunt
      /^t+w+a+t+$/,
      /^w+a+n+k+e+r+$/,
      /^b+o+l+l+o*c+k+s+$/,
      /^m+o+t+h+e+r+f+u+c+k+(?:e+r+)?$/,
    ];

    function isWordBlocked(word) {
      if (!word || word.length < 2) return false;

      // Lowercase first
      const lower = word.toLowerCase();

      // Apply symbol-to-letter mapping BEFORE stripping non-alpha
      const symbolMapped = lower
        .replace(/@/g, 'a')
        .replace(/!/g, 'i')
        .replace(/\$/g, 's')
        .replace(/\*/g, '')
        .replace(/\+/g, 't')
        .replace(/0/g, 'o')
        .replace(/1/g, 'i')
        .replace(/3/g, 'e')
        .replace(/4/g, 'a')
        .replace(/5/g, 's')
        .replace(/7/g, 't');

      // Normalize: remove non-alphabetic chars
      const normalized = symbolMapped.replace(/[^a-z]/g, '');

      // Allow-list wins over everything
      if (ALLOWED_WORDS.has(normalized)) return false;

      // Direct match check (O(1) lookup)
      if (BLOCKED_WORDS_SET.has(normalized)) return true;

      // Fuzzy pattern matching for obfuscated words
      for (const pattern of FUZZY_PATTERNS) {
        if (pattern.test(normalized)) return true;
      }

      return false;
    }

    // === Speech Recognition ===
    const micBtn = document.getElementById('micBtn');
    const listeningText = document.getElementById('listeningText');
    const wordStage = document.getElementById('wordStage');
    const displayWord = document.getElementById('displayWord');
    const tapHint = document.getElementById('tapHint');
    const errorMsg = document.getElementById('errorMsg');
    const waveformContainer = document.getElementById('waveformContainer');
    const waveformCanvas = document.getElementById('waveformCanvas');
    const errorText = document.getElementById('errorText');
    const errorRetry = document.getElementById('errorRetry');

    let isListening = false;
    let errorTimer = null;
    let isAnimating = false;
    let audioContext = null;
    let analyser = null;
    let microphone = null;
    let mediaStream = null;
    let animationId = null;
    let canvasInitialized = false;
    let cachedGradient = null;
    let dataArray = null;
    let audioInitialized = false;

    // Error message mapping (kid-friendly)
    const errorMessages = {
        'not-allowed': "Oops! I need your grown-up to let me use the microphone.",
        'no-microphone': "I can't hear you! Is your microphone working?",
        'network': "Hmm, I can't reach the internet. Ask a grown-up for help?",
        'audio-capture': "Something's wrong with the microphone. Let's try again!",
        'default': "Something went wrong. Let's try again!"
    };

    // Every rejection — blocked word, misheard, silence, low confidence —
    // gets this EXACT message. A distinct "blocked" reply would confirm to a
    // probing kid that they found live ammunition; uniform rejection gives
    // no signal at all.
    const RETRY_MESSAGE = "Didn't catch that. Try again.";
    // Below this, speech is likely mumbled or exaggerated — ask again
    // rather than guess. Clear homework speech never comes near it.
    const CONFIDENCE_THRESHOLD = 0.7;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    // Create (or recreate) a fresh SpeechRecognition instance.
    // Called on init and when returning from background — mobile browsers
    // kill the recognition session but leave the JS object in a dead state.
    function createRecognition() {
      if (!SpeechRecognition) return null;
      const r = new SpeechRecognition();
      r.lang = 'en-US';
      r.interimResults = false;
      r.maxAlternatives = 3;

      r.onresult = (event) => {
        const result = event.results[0];
        const alternatives = [];
        for (let i = 0; i < result.length; i++) {
          alternatives.push(result[i].transcript.toLowerCase());
        }

        // Mumbled or exaggerated speech → ask again, don't guess.
        // iOS Safari sometimes reports confidence as 0 for every result;
        // treat 0 as "unknown" and let the word through.
        if (isLowConfidence(result.confidence)) {
          showError(RETRY_MESSAGE);
          stopListening();
          return;
        }

        // Extract a candidate from EVERY alternative and reject if any of
        // them is blocked — the recogniser sometimes politely picks the
        // innocent reading of ambiguous audio.
        const candidates = [];
        for (const alt of alternatives) {
          const word = extractWord([alt]);
          if (word) candidates.push(word);
        }
        if (candidates.length === 0 || candidates.some(isWordBlocked)) {
          showError(RETRY_MESSAGE);
          stopListening();
          return;
        }
        showWord(candidates[0]);
      };

      r.onerror = (event) => {
        let errorMessage = '';

        // Map error codes to user-friendly messages
        if (event.error === 'no-speech') {
          errorMessage = RETRY_MESSAGE;  // same as every other rejection
        } else if (event.error === 'not-allowed' || event.error === 'permission-denied') {
          errorMessage = errorMessages['not-allowed'];
        } else if (event.error === 'no-microphone' || event.error === 'devices-not-found') {
          errorMessage = errorMessages['no-microphone'];
        } else if (event.error === 'network' || event.error === 'service-not-allowed') {
          errorMessage = errorMessages['network'];
        } else if (event.error === 'audio-capture') {
          errorMessage = errorMessages['audio-capture'];
        } else {
          errorMessage = errorMessages['default'];
        }

        if (errorMessage === RETRY_MESSAGE) {
          showError(errorMessage);
        } else {
          showStickyError(errorMessage);
        }
        stopListening();
      };

      r.onend = () => {
        stopListening();
      };

      return r;
    }

    if (!SpeechRecognition) {
      micBtn.style.display = 'none';
      showError('Voice not supported. Try Chrome or Safari.', { sticky: true });
    } else {
      recognition = createRecognition();
    }

    // === Word Extraction ===
    function extractWord(alternatives) {
      // Patterns capture everything after "spell" up to end of string
      // so "how to spell ice cream" → "ice cream"
      const patterns = [
        /(?:how to|how do you|how do|can you|could you)\s+spell\s+(.+)/i,
        /(?:what is|what's|whats)\s+(?:the word\s+)?(?:for\s+)?(.+)/i,
        /spell\s+(.+)/i,
        /(?:tell me|say)\s+(?:how to spell\s+)?(.+)/i,
      ];

      for (const alt of alternatives) {
        for (const pattern of patterns) {
          const match = alt.match(pattern);
          if (match) {
            // Clean: keep only letters and spaces, trim, lowercase
            const cleaned = match[1].replace(/[^a-z\s]/gi, '').trim().toLowerCase();
            if (cleaned.length >= 2) {
              return cleaned;
            }
          }
        }
      }

      // Fallback: last meaningful word
      for (const alt of alternatives) {
        const words = alt.split(/\s+/).filter(w => w.length >= 2 && /^[a-z]+$/i.test(w));
        if (words.length > 0) {
          return words[words.length - 1].toLowerCase();
        }
      }

      return null;
    }

    // Display in proper case: "Dinosaur", exactly how it should land in the
    // kid's writing — they copy straight off this screen into their sentence.
    // All-caps flattens word shape (harder to read) and invites ALL-CAPS
    // homework. Anti-troll safety lives in uniform rejection, not casing.
    function formatWord(word) {
      return word.charAt(0).toUpperCase() + word.slice(1);
    }

    // True only when the recogniser reports a real but low confidence.
    // 0 means "unknown" (iOS Safari quirk) and must NOT be rejected.
    function isLowConfidence(confidence) {
      return confidence > 0 && confidence < CONFIDENCE_THRESHOLD;
    }

    // === Show Word ===
    async function showWord(word) {
      isAnimating = true;
      stopListening();

      if (isWordBlocked(word)) {
        showError(RETRY_MESSAGE);
        isAnimating = false;
        return;
      }

      // Track word requested (no PII — only word length)
      trackEvent('word_requested', {
        word_length: word.length,
        browser: browserInfo.browser,
        device_type: deviceType
      });

      wordStage.classList.add('active');
      displayWord.textContent = formatWord(word);
      tapHint.style.display = 'block';
      wordStage.focus();

      await waitForTapOrKey();
      hideWordStage();
      isAnimating = false;
    }

    function waitForTapOrKey() {
      return new Promise((resolve) => {
        const handler = (e) => {
          if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          wordStage.removeEventListener('click', handler);
          wordStage.removeEventListener('keydown', handler);
          resolve();
        };
        wordStage.addEventListener('click', handler);
        wordStage.addEventListener('keydown', handler);
      });
    }

    // === UI ===
    async function startListening() {
      if (isAnimating || isListening || !recognition) return;
      try {
        recognition.start();
        isListening = true;
        micBtn.classList.add('listening');
        listeningText.classList.add('show');
        waveformContainer.classList.add('show');
        if (await initAudioOnce()) {
          startVisualization();
        }
      } catch (e) {
        console.warn('Failed to start recognition:', e);
        stopListening();
      }
    }

    function stopListening() {
      if (!isListening && !micBtn.classList.contains('listening')) return;
      try { if (recognition) recognition.stop(); } catch (e) {}
      // Do NOT release the MediaStream here, even though holding it keeps
      // the OS mic indicator lit between listens. iOS Safari can't reliably
      // hand the mic back to SpeechRecognition once getUserMedia has been
      // cycled — the second listen starts but hears nothing (regression in
      // fd226a4, confirmed on iPhone). The stream lives for the page
      // session; resetAudioState() tears it down on background/return,
      // which is the safe place to release it.
      isListening = false;
      micBtn.classList.remove('listening');
      listeningText.classList.remove('show');
      waveformContainer.classList.remove('show');
      stopAudioVisualization();
    }

    function hideWordStage() {
      wordStage.classList.remove('active');
      tapHint.style.display = 'none';
      displayWord.textContent = '';
    }

    // Soft misses auto-hide (kid mid-flow). Grown-up problems (permission,
    // network, hardware) stay until dismissed or retried.
    function showError(msg, opts = {}) {
      const sticky = !!opts.sticky;
      errorText.textContent = msg;
      errorRetry.hidden = !opts.retry;
      errorMsg.classList.toggle('sticky', sticky);
      errorMsg.classList.add('show');
      if (errorTimer) {
        clearTimeout(errorTimer);
        errorTimer = null;
      }
      if (!sticky) {
        errorTimer = setTimeout(() => {
          hideError();
        }, 3000);
      }
    }

    function hideError() {
      errorMsg.classList.remove('show');
      errorMsg.classList.remove('sticky');
      errorRetry.hidden = true;
      errorText.textContent = '';
      if (errorTimer) {
        clearTimeout(errorTimer);
        errorTimer = null;
      }
    }

    errorRetry.addEventListener('click', () => {
      hideError();
      startListening();
    });

    function showStickyError(msg) {
      showError(msg, { sticky: true, retry: true });
    }

    // === Audio Visualization (Waveform) ===
    // Init audio ONCE on first mic click — iOS Safari re-prompts or fails on subsequent getUserMedia calls
    async function initAudioOnce() {
      if (audioInitialized) return true;
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;

        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        microphone = audioContext.createMediaStreamSource(mediaStream);
        microphone.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        audioInitialized = true;
        return true;
      } catch (e) {
        console.warn('Audio visualization not available:', e);
        if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
          showStickyError(errorMessages['not-allowed']);
        } else if (e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError') {
          showStickyError(errorMessages['no-microphone']);
        } else if (e.name === 'NotReadableError' || e.name === 'TrackStartError') {
          showStickyError(errorMessages['audio-capture']);
        } else {
          showStickyError(errorMessages['default']);
        }
        return false;
      }
    }

    function startVisualization() {
      if (!audioInitialized) return;
      // iOS can suspend the AudioContext after interruptions (Siri, alarms)
      // without firing visibilitychange — revive it if needed.
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume().catch(() => {});
      }
      canvasInitialized = false;
      drawWaveform();
    }

    let cachedRect = null;

    function initCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = waveformCanvas.getBoundingClientRect();
      waveformCanvas.width = rect.width * dpr;
      waveformCanvas.height = rect.height * dpr;
      const ctx = waveformCanvas.getContext('2d');
      ctx.scale(dpr, dpr);

      cachedGradient = ctx.createLinearGradient(0, 0, 0, rect.height);
      cachedGradient.addColorStop(0, '#ff3b30');
      cachedGradient.addColorStop(1, '#ff9500');
      cachedRect = { width: rect.width, height: rect.height };
      canvasInitialized = true;
    }

    function drawWaveform() {
      if (!analyser || !isListening) return;
      if (!canvasInitialized) initCanvas();

      const ctx = waveformCanvas.getContext('2d');
      const { width, height } = cachedRect;

      animationId = requestAnimationFrame(drawWaveform);
      analyser.getByteFrequencyData(dataArray);
      ctx.clearRect(0, 0, width, height);

      const barWidth = (width / dataArray.length) * 2.5;
      let x = 0;
      ctx.fillStyle = cachedGradient;

      for (let i = 0; i < dataArray.length; i++) {
        const barHeight = (dataArray[i] / 255) * height;
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(x, (height - barHeight) / 2, barWidth - 1, barHeight, 2);
        } else {
          ctx.rect(x, (height - barHeight) / 2, barWidth - 1, barHeight);
        }
        ctx.fill();
        x += barWidth + 1;
      }
    }

    function stopAudioVisualization() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      canvasInitialized = false;
      cachedGradient = null;
      cachedRect = null;
    }

    // Reset stale audio state so next mic tap re-initialises cleanly.
    // Called when the app resumes from background — mobile browsers
    // suspend AudioContext and kill MediaStream tracks on backgrounding.
    function resetAudioState() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }
      if (audioContext) {
        audioContext.close().catch(() => {});
        audioContext = null;
      }
      analyser = null;
      microphone = null;
      dataArray = null;
      audioInitialized = false;
      canvasInitialized = false;
      cachedGradient = null;
      cachedRect = null;
    }

    micBtn.addEventListener('click', () => {
      if (isAnimating) return;
      
      // Track mic button click
      trackEvent('mic_button_click', {
        browser: browserInfo.browser,
        device_type: deviceType
      });
      
      if (isListening) {
        stopListening();
      } else {
        startListening();
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // Reset audio state when returning from background.
    // Safari keeps tabs alive, so we just need to handle stale
    // AudioContext/MediaStream (not full page kills).
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        stopListening();
        resetAudioState();
        recognition = createRecognition();
      }
    });
  </script>

</body>
